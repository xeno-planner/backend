version: '1.0'

services:
  db:
    image: postgres:15-alpine
    container_name: xenoplanner-compose-db
    restart: always
    ports:
      - "5500:5432"
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    networks:
      - default

  backend:
    build: .
    container_name: xenoplanner-backend
    ports:
      - "4000:4242"
    depends_on:
      - db
    environment:
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_HOST=${APP_HOST}
      - APP_FULL_URL=${APP_FULL_URL}
      - FRONT_END_HOST=${FRONT_END_HOST}
      - ENV_MODE=${ENV_MODE}
    networks:
      - default

networks:
  default: